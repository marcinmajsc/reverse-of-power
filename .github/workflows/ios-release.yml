name: Build iOS IPA

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 27
        run: |
          xcode_path="$(find /Applications -maxdepth 1 -type d -name 'Xcode_27*.app' -print | sort | tail -1)"
          if [[ -z "$xcode_path" ]]; then
            echo "Xcode 27 is required to build and validate against the iOS 27 SDK." >&2
            exit 1
          fi
          sudo xcode-select --switch "$xcode_path/Contents/Developer"
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          [[ "$sdk_version" == 27.* ]] || { echo "Selected iOS SDK is $sdk_version, expected 27.x." >&2; exit 1; }

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Run unit tests
        working-directory: ios
        run: swift test

      - name: Archive application
        working-directory: ios
        run: |
          xcodebuild -project ReverseOfPower.xcodeproj -scheme ReverseOfPower \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ReverseOfPower.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/ReverseOfPower.xcarchive/Products/Applications/ReverseOfPower.app" \
            "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload \
            "$GITHUB_WORKSPACE/ios/ReverseOfPower.ipa"

      - uses: actions/upload-artifact@v5
        with:
          name: ReverseOfPower-iOS
          path: ios/ReverseOfPower.ipa

      - name: Upload IPA to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/ReverseOfPower.ipa
