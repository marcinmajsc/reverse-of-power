name: ReverseOfPower
options:
  bundleIdPrefix: com.game
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
targets:
  ReverseOfPower:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
    dependencies:
      - target: ReverseOfPowerCore
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Reverse of Power
        UILaunchScreen: {}
        NSCameraUsageDescription: Zdjęcie jest używane jako portret gracza.
        NSLocalNetworkUsageDescription: Aplikacja łączy się z grą PlayLink w sieci lokalnej.
        NSBonjourServices: ["_companion-link._udp"]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.game.reverseofpower
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: [ReverseOfPowerCoreTests]
  ReverseOfPowerCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/Core
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.game.reverseofpower.core
  ReverseOfPowerCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: ReverseOfPowerCore
